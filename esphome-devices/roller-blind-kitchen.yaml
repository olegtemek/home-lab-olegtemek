esphome:
  name: roller-blind-kitchen-esp32
  friendly_name: Roller Blind Kitchen
  on_boot:
    priority: -100
    then:
      - lambda: |-
          int pos = id(blind_position);
          id(motor1).report_position(pos * ${steps_motor1} / 100);
          id(motor1).set_target(pos * ${steps_motor1} / 100);
          id(motor2).report_position(pos * ${steps_motor2} / 100);
          id(motor2).set_target(pos * ${steps_motor2} / 100);
      - cover.template.publish:
          id: kitchen_blind
          position: !lambda 'return id(blind_position) / 100.0;'

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: "key"

ota:
  - platform: esphome
    password: "pass"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

# Настройка шагов для каждого мотора
substitutions:
  steps_motor1: "4800"
  steps_motor2: "38000"

globals:
  - id: blind_position
    type: int
    restore_value: true
    initial_value: '0'

  - id: motors_enabled
    type: bool
    initial_value: 'false'

stepper:
  - platform: a4988
    id: motor1
    dir_pin: GPIO16
    step_pin: GPIO17
    max_speed: 220 steps/s
    acceleration: 120 steps/s^2
    deceleration: 120 steps/s^2

  - platform: a4988
    id: motor2
    dir_pin: GPIO18
    step_pin: GPIO19
    max_speed: 1800 steps/s
    acceleration: 800 steps/s^2
    deceleration: 800 steps/s^2

output:
  - platform: gpio
    id: enable1
    pin:
      number: GPIO4
      inverted: true

  - platform: gpio
    id: enable2
    pin:
      number: GPIO5
      inverted: true

script:
  - id: move_to_position
    parameters:
      target: int
    then:
      - output.turn_on: enable1
      - output.turn_on: enable2
      - lambda: 'id(motors_enabled) = true;'
      - stepper.set_target:
          id: motor1
          target: !lambda 'return target * ${steps_motor1} / 100;'
      - stepper.set_target:
          id: motor2
          target: !lambda 'return target * ${steps_motor2} / 100;'

interval:
  - interval: 200ms
    then:
      - lambda: |-
          bool moving = (id(motor1).current_position != id(motor1).target_position) ||
                        (id(motor2).current_position != id(motor2).target_position);

          if (id(motors_enabled)) {
            int pos = (id(motor1).current_position * 100 + ${steps_motor1} / 2) / ${steps_motor1};
            pos = std::max(0, std::min(100, pos));
            id(blind_position) = pos;

            id(kitchen_blind).position = pos / 100.0f;
            id(kitchen_blind).publish_state();
          }

          if (!moving && id(motors_enabled)) {
            id(motors_enabled) = false;
            id(enable1).turn_off();
            id(enable2).turn_off();
          }

cover:
  - platform: template
    name: "Kitchen Blind"
    id: kitchen_blind
    device_class: blind
    has_position: true

    open_action:
      - script.execute:
          id: move_to_position
          target: 100

    close_action:
      - script.execute:
          id: move_to_position
          target: 0

    stop_action:
      - stepper.set_target:
          id: motor1
          target: !lambda 'return id(motor1).current_position;'
      - stepper.set_target:
          id: motor2
          target: !lambda 'return id(motor2).current_position;'

    position_action:
      - script.execute:
          id: move_to_position
          target: !lambda 'return (int)(pos * 100);'

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"

button:
  - platform: restart
    name: "Restart"