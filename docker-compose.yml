services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ${DATA_ROOT}/npm/data:/data
      - ${DATA_ROOT}/npm/letsencrypt:/etc/letsencrypt
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  esphome:
    image: ghcr.io/esphome/esphome:latest
    container_name: esphome
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${DATA_ROOT}/esphome/config:/config
      - /etc/localtime:/etc/localtime:ro

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - SIGNUPS_ALLOWED=${VAULTWARDEN_SIGNUPS_ALLOWED}
      - DOMAIN=${VAULTWARDEN_DOMAIN}
    volumes:
      - ${DATA_ROOT}/vaultwarden:/data
    expose:
      - "80"
    networks:
      - proxy

  photoprism:
    image: photoprism/photoprism:latest
    container_name: photoprism
    restart: unless-stopped
    environment:
      - PHOTOPRISM_ADMIN_USER=${PHOTOPRISM_ADMIN_USER}
      - PHOTOPRISM_ADMIN_PASSWORD=${PHOTOPRISM_ADMIN_PASSWORD}
      - PHOTOPRISM_DATABASE_DRIVER=sqlite
      - PHOTOPRISM_ORIGINALS_LIMIT=${PHOTOPRISM_ORIGINALS_LIMIT}
      - PHOTOPRISM_SITE_URL=${PHOTOPRISM_SITE_URL}
    working_dir: /photoprism
    volumes:
      - ${DATA_ROOT}/photoprism/photos:/photoprism/originals
      - ${DATA_ROOT}/photoprism/storage:/photoprism/storage
    expose:
      - "2342"
    networks:
      - proxy

  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    expose:
      - "80"
    volumes:
      - ${DATA_ROOT}/filebrowser/share:/srv
      - ${DATA_ROOT}/filebrowser/data:/data
    restart: unless-stopped
    networks:
      - proxy

networks:
  proxy:
    name: proxy